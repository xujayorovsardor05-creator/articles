<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qodirova Shahrizoda Maqolalari</title>
    <style>
        :root {
            --burgundy: #800020;
            --burgundy-light: #a3143a;
            --bg-color: #0b0f19;
            --card-bg: #111625;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Orqa fondagi katta xira matn effekti */
        .bg-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8vw;
            font-weight: 900;
            color: rgba(128, 0, 32, 0.12); /* Bardoviy tusdagi xira fon */
            white-space: nowrap;
            z-index: 0;
            user-select: none;
            pointer-events: none;
            letter-spacing: 5px;
        }

        /* Markaziy oyna (Card) */
        .welcome-card {
            position: relative;
            z-index: 1;
            background-color: var(--card-bg);
            border: 1px solid rgba(128, 0, 32, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(128, 0, 32, 0.15);
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        .welcome-card h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .welcome-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--burgundy), var(--burgundy-light));
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(128, 0, 32, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(163, 20, 58, 0.6);
            background: linear-gradient(135deg, var(--burgundy-light), #c21847);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Orqa fondagi xira ism -->
    <div class="bg-watermark">QODIROVA SHAHRIZODA</div>

    <!-- Markaziy qism -->
    <div class="welcome-card">
        <h1>Xush kelibsiz!</h1>
        <p>Bu yerda Qodirova Shahrizodaning shaxsiy maqolalari va qiziqarli ilmiy ishlanmalari e'lon qilib boriladi.</p>
        <a href="#" class="btn">Maqolalarni ko'rish</a>
    </div>

</body>
</html>
