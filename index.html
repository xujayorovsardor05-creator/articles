<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qodirova Shahrizoda - Portfoliyo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .hero-container {
            background: #111625;
            padding: 45px 35px;
            border-radius: 12px;
            border: 1px solid rgba(128, 0, 32, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #ff99aa;
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(255, 153, 170, 0.3);
            letter-spacing: 0.5px;
        }
        .subtitle {
            color: #cbd5e1;
            font-size: 1.15rem;
            margin-bottom: 25px;
            font-weight: 500;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .enter-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #800020;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 12px rgba(128, 0, 32, 0.4);
        }
        .enter-btn:hover {
            background-color: #a3143a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <h1>Qodirova Shahrizoda</h1>
        <div class="subtitle">Boshlang'ich ta'lim tadqiqotchisi va pedagog</div>
        <p>Mazkur veb-sayt boshlangʻich sinf oʻquvchilarida mantiqiy va ijodiy fikrlashni rivojlantirishga bagʻishlangan ilmiy maqolalar va pedagogik ishlanmalarga bag'ishlangan.</p>
        <a href="articles.html" class="enter-btn">Maqolalarni ko'rish &rarr;</a>
    </div>

</body>
</html>
